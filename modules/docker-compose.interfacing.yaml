services:
  interfacing:
    build: &interfacing
      context: ..
      dockerfile: docker/interfacing/interfacing.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
      cache_from:
        - "${INTERFACING_IMAGE:?}:${TAG}"
        - "${INTERFACING_IMAGE:?}:main"
    image: "${INTERFACING_IMAGE:?}:${TAG}"
    command: /bin/bash -c "ros2 launch can can.launch.py"
    privileged: true
    network_mode: host # Allow the container to access the host's network interfaces
    cap_add: # Grant the capability to configure network interfaces
      - NET_ADMIN
    environment:
      # Avoid FastDDS SHM isolation between can_node and docker-exec shells
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - /dev:/dev # Allow access to host devices
      - ${MONO_DIR}/src/interfacing:/root/ament_ws/src/interfacing
      # For calibrate_arm.py --write-mapping
      - ${MONO_DIR}/src/interfacing/joint_command/config/hardware_mapping.yaml:/calibration/hardware_mapping.yaml
      # Telemetry run folders (gl40_mit_move.py / gl40_bench.py / telemetry_record.py write
      # here; the host-side plotter reads them). outputs/ is gitignored.
      - ${MONO_DIR}/outputs:/outputs
      # Read-only copy of the limits, so telemetry can record the ceilings it is judging
      # against (the writable single-file /calibration mount above is for calibrate_arm.py)
      - ${MONO_DIR}/src/interfacing/joint_command/config:/opt/joint_command_config:ro

  joint_command:
    build:
      context: ..
      dockerfile: docker/interfacing/joint_command/joint_command.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${INTERFACING_JOINT_COMMAND_IMAGE:?}:${TAG}"
        - "${INTERFACING_JOINT_COMMAND_IMAGE:?}:main"
    image: "${INTERFACING_JOINT_COMMAND_IMAGE:?}:${TAG}"
    network_mode: host
    environment:
      # Same as the interfacing service: without this, FastDDS prefers shared memory, and a
      # node started by `docker exec` under a different user than the publisher silently fails
      # to discover it (the segments in /dev/shm are per-user). Costs nothing on host net.
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    # no working_dir override: the image's WORKDIR is ${AMENT_WS}, where the
    # relative ENTRYPOINT ./wato_ros_entrypoint.sh lives
    # editable src is bind-mounted; launch it yourself:
    #   watod -t joint_command  ->  ros2 launch joint_command joint_command.launch.py
    command: tail -F anything
    volumes:
      - ${MONO_DIR}/src/interfacing/joint_command:/root/ament_ws/src/joint_command
      # telemetry_record.py runs here too (it needs the ROS topics, not the CAN bus). Mounted
      # OUTSIDE /root: this container runs as the host user, who cannot traverse root's home.
      - ${MONO_DIR}/src/interfacing/can/scripts:/opt/humanoid_scripts:ro
      - ${MONO_DIR}/src/interfacing/joint_command/config/hardware_mapping.yaml:/calibration/hardware_mapping.yaml:ro
      - ${MONO_DIR}/src/interfacing/joint_command/config:/opt/joint_command_config:ro
      - ${MONO_DIR}/outputs:/outputs
